<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickman Fight</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="menu">
  <h1>⚔ STICKMAN FIGHT</h1>
  <p class="subtitle">EDICIÓN ULTIMATE</p>

  <h2>Modo de juego</h2>
  <div class="mode-row" id="modeRow">
    <button class="mode-btn selected" data-mode="rapido">⚔ DUELO RÁPIDO</button>
    <button class="mode-btn" data-mode="roguelike">🎲 ROGUELIKE · 30 PISOS</button>
  </div>

  <h2>Elige tu luchador</h2>
  <div class="char-grid" id="charGrid"></div>

  <div class="bottom-row">
    <div class="difficulty-row" id="diffRow">
      <button class="diff-btn" data-diff="facil">FÁCIL</button>
      <button class="diff-btn selected" data-diff="normal">NORMAL</button>
      <button class="diff-btn" data-diff="dificil">DIFÍCIL</button>
      <button class="diff-btn" data-diff="pesadilla">🔥 PESADILLA</button>
    </div>
    <button id="startBtn">EMPEZAR ▶</button>
  </div>

  <div id="recordsPanel" class="records-panel">🏆 Sin récords todavía. ¡Gana tu primera pelea!</div>
</div>

<div id="gameScreen">
  <button id="backBtn">← Menú</button>
  <div class="game-wrap">
    <canvas id="game" width="950" height="520"></canvas>

    <!-- Overlay: elección de mejora (roguelike) -->
    <div id="upgradeOverlay" class="overlay">
      <div class="overlay-title">PISO SUPERADO</div>
      <div class="overlay-sub" id="upgradeSub">Elige una mejora</div>
      <div class="upgrade-grid" id="upgradeGrid"></div>
    </div>

    <!-- Overlay: game over (roguelike) -->
    <div id="gameOverOverlay" class="overlay">
      <div class="overlay-title red" id="goTitle">DERROTA</div>
      <div class="overlay-sub" id="goSub"></div>
      <div class="overlay-stats" id="goStats"></div>
      <button class="overlay-btn" id="goMenuBtn">VOLVER AL MENÚ</button>
    </div>

    <!-- Overlay: victoria total -->
    <div id="victoryOverlay" class="overlay">
      <div class="overlay-title gold">¡VICTORIA TOTAL!</div>
      <div class="overlay-sub">Has completado los 30 pisos</div>
      <div class="overlay-stats" id="victoryStats"></div>
      <button class="overlay-btn" id="victoryMenuBtn">VOLVER AL MENÚ</button>
    </div>
  </div>

  <div class="controls-info">
    <div class="ctrl-box"><b>Mover</b><span class="key">A</span><span class="key">D</span></div>
    <div class="ctrl-box"><b>Dash</b><span class="key">A</span><span class="key">A</span></div>
    <div class="ctrl-box"><b>Saltar</b><span class="key">W</span></div>
    <div class="ctrl-box"><b>Agachar</b><span class="key">S</span></div>
    <div class="ctrl-box"><b>Puño</b><span class="key">J</span></div>
    <div class="ctrl-box"><b>Patada</b><span class="key">K</span></div>
    <div class="ctrl-box"><b>Uppercut</b><span class="key">U</span></div>
    <div class="ctrl-box"><b>ESPECIAL</b><span class="key">I</span></div>
    <div class="ctrl-box"><b>Bloquear</b><span class="key">L</span></div>
    <div class="ctrl-box"><b>Pausa</b><span class="key">P</span></div>
  </div>
</div>

<div id="errorBox"></div>

<script src="js/config.js"></script>
<script src="js/effects.js"></script>
<script src="js/fighter.js"></script>
<script src="js/roguelike.js"></script>
<script src="js/main.js"></script>
</body>
</html>
